/**/**:
  ros__parameters:
    rate: # Hz
      external_loop_control: 100.0 
      internal_loop_control: 250.0 
      diagnostics: 100.0

    takeoff:
      height: 1.5 # m
      speed: 1.0 # m/s

    land:
      increment_rampdown: 0.15 # [0, 1]
      threshold_detect: 0.70 # [0, 1]
      speed: 0.3 # m/s

    reference:
      timeout: 0.50 # seconds since the last native trajectory window

    goal:
      position_tolerance: 0.45
      heading_tolerance: 3.15

    debug:
      publish_reference_path: true

    benchmark_metrics:
      enabled: true
      csv_path: /tmp/laser_uav_control_metrics.csv

    filter_params:
      butterworth:
        gyro_a: [1.0000, -1.5782, 0.6528]
        gyro_b: [0.018650, 0.037301, 0.018650]

        motor_a: [1.0000, -1.5782, 0.6528]
        motor_b: [0.018650, 0.037301, 0.018650]

    safe_area:
      enabled: false

      # This is the range of the safety area in x, y and z axis
      constraints:
        x: [-2.0, 2.0] 
        y: [-2.0, 2.0]
        z: [0.5, 3.0]

        # The cube down represent up constraints
        #  (x , y)
        # (2.0, 2.0)  --------------------- (2.0, -2.0)
        #     |                                  | 
        #     |                                  | 
        #     |                                  | 
        #     |                                  | 
        #     |                                  |       0.5 <= z <= 3.0
        #     |                                  | 
        #     |                                  | 
        #     |                                  | 
        #     |                                  | 
        # (-2.0, 2.0) --------------------- (-2.0, -2.0)

